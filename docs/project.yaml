# Project details
title:
  es: Plantilla de portfolio web expandible
  en: Expandable web portfolio template

abstract:
  es: |
    Desarrollo de una plantilla de portfolio web personal, planteada como una base
    flexible y expandible para mostrar proyectos creativos. Aunque el diseño está
    enfocado en mi perfil, la estructura está pensada para poder añadir
    fácilmente nuevos proyectos, secciones y contenidos en el futuro. Actualmente
    incluye ejemplos de proyectos con información semi-inventada, utilizados como
    demostración del funcionamiento y escalabilidad de la plantilla.
  en: |
    Development of a personal web portfolio template designed as a flexible and
    expandable base for showcasing creative projects. Although the design is
    focused on the author’s profile, the structure allows for easy addition of new
    projects, sections, and content over time. The current version includes
    semi-fictional project data used to demonstrate the template’s functionality
    and scalability.

